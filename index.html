<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Google</title>
<link rel="icon" href="https://www.google.com/favicon.ico">

<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b0f;
    --surface: #121217;
    --surface-2: #18181e;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.17);
    --text-1: #f4f4f5;
    --text-2: #a1a1aa;
    --text-3: #71717a;
    --accent: #22d3ee;
    --accent-hover: #67e8f9;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Geist', sans-serif;
    --r-surface: 16px;
    --r-chip: 12px;
    --r-go: 10px;
  }

  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text-1);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    padding: 40px clamp(16px, 4vw, 22px);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  ::selection { background: rgba(34,211,238,0.25); }

  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .bg::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(820px 380px at 50% -10%, rgba(34,211,238,0.10), transparent 70%),
      radial-gradient(560px 320px at 50% 112%, rgba(88,101,242,0.055), transparent 72%);
  }
  .bg::after {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse 72% 62% at 50% 6%, black 10%, transparent 72%);
    mask-image: radial-gradient(ellipse 72% 62% at 50% 6%, black 10%, transparent 72%);
  }

  main { position: relative; z-index: 1; width: 100%; max-width: 540px; margin: auto; }

  header { text-align: center; margin-bottom: 30px; }
  header img {
    display: block;
    width: min(340px, 92%);
    height: auto;
    margin: 0 auto 12px;
    user-select: none;
    -webkit-user-drag: none;
  }
  header p {
    margin: 0 auto; max-width: 44ch;
    font-size: 13.5px; font-weight: 400; letter-spacing: 0.01em;
    color: var(--text-2);
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .span-2 { grid-column: span 2; }

  .section-relays { margin-top: 40px; display: flex; flex-direction: column; gap: 12px; }

  .cell {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    padding: 15px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-surface);
    cursor: pointer; text-align: left;
    font-family: inherit; font-size: inherit; color: inherit;
    text-decoration: none; user-select: none;
    transition-property: background-color, border-color, transform, box-shadow;
    transition-duration: 0.25s;
    transition-timing-function: var(--ease-out);
  }
  .cell:hover {
    background: var(--surface-2);
    border-color: var(--border-strong);
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
  }
  .cell:active { transform: translateY(0) scale(0.985); transition-duration: 0.1s; }
  .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Pointer spotlight: interior wash + border ring glow */
  .cell::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%), var(--glow), transparent 65%);
    opacity: 0; transition: opacity 0.3s var(--ease-out);
    pointer-events: none;
  }
  .cell::after {
    content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px;
    background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), var(--glow-strong), transparent 65%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
    opacity: 0; transition: opacity 0.3s var(--ease-out);
    pointer-events: none;
  }
  .cell:hover::before, .cell:hover::after { opacity: 1; }

  /* Featured download card: cyan-tinted border marks it as the primary
     surface before a single pixel of hover happens */
  .featured {
    --glow: rgba(34,211,238,0.06); --glow-strong: rgba(34,211,238,0.35);
    border-color: rgba(34,211,238,0.24);
    background: linear-gradient(130deg, rgba(34,211,238,0.06), transparent 42%), var(--surface);
  }
  .featured:hover {
    border-color: rgba(34,211,238,0.42);
    background: linear-gradient(130deg, rgba(34,211,238,0.09), transparent 45%), var(--surface-2);
  }

  .dl { flex-direction: column; align-items: stretch; gap: 14px; padding: 18px; }
  .dl-top { display: flex; align-items: center; gap: 12px; }
  .dl-note {
    display: block;
    font-size: 12.5px; line-height: 1.6; color: var(--text-2);
    max-width: 52ch;
  }

  /* ===== Primary CTA: the only saturated filled element on the page ===== */
  .dl-cta {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%;
    padding: 13px 16px;
    border: none;
    border-radius: var(--r-chip);
    background: var(--accent);
    color: #07161a;
    font-family: var(--font-body);
    font-size: 14px; font-weight: 700; letter-spacing: 0.01em;
    cursor: pointer;
    user-select: none;
    transition-property: background-color, transform;
    transition-duration: 0.2s;
    transition-timing-function: var(--ease-out);
  }
  .dl-cta svg { width: 17px; height: 17px; }
  .featured:hover .dl-cta { background: var(--accent-hover); }
  .dl-cta:hover { background: var(--accent-hover); }
  .dl-cta:active { transform: scale(0.98); }
  .dl-cta.ok   { background: #ffffff; color: #0b0b0f; }
  .dl-cta.bad  { background: rgba(239,68,68,0.14); color: #f87171; box-shadow: inset 0 0 0 1px rgba(239,68,68,0.4); }
  .spin {
    display: inline-block; width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid rgba(7,22,26,0.25); border-top-color: currentColor;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Disclosure header ===== */
  .gate {
    --glow: rgba(255,255,255,0.035); --glow-strong: rgba(255,255,255,0.18);
    width: 100%;
    padding: 13px 14px 13px 16px;
  }
  .gate:hover {
    background: var(--surface-2);
    border-color: var(--border-strong);
    transform: none;
    box-shadow: none;
  }
  .gate:active { transform: none; }
  .gate-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .gate-text .name { font-size: 15px; }
  .gate-text .desc { white-space: normal; line-height: 1.5; }
  .gate-text .desc b { color: #fbbf24; font-weight: 600; }

  .gate-action {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 7px;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-1);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 6px 14px;
    transition-property: background-color, border-color, color;
    transition-duration: 0.2s;
    transition-timing-function: var(--ease-out);
  }
  .gate:hover .gate-action { background: #ffffff; border-color: #ffffff; color: #0b0b0f; }
  .gate-action svg {
    width: 12px; height: 12px;
    transition: transform 0.3s var(--ease-out);
  }
  .gate[aria-expanded="true"] .gate-action svg { transform: rotate(180deg); }

  /* Collapsible region: grid-rows 0fr to 1fr animates real height */
  .reveal-wrap {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.4s var(--ease-out);
  }
  .reveal-wrap.open { grid-template-rows: 1fr; }
  .reveal-inner { overflow: hidden; min-height: 0; }
  .relay-list {
    display: flex; flex-direction: column; gap: 12px;
    opacity: 0; transform: translateY(6px);
    transition: opacity 0.3s var(--ease-out), transform 0.3s var(--ease-out);
  }
  .reveal-wrap.open .relay-list { opacity: 1; transform: none; transition-delay: 0.08s; }

  /* Relay link cards */
  .relay { --glow: rgba(255,255,255,0.045); --glow-strong: rgba(255,255,255,0.22); }

  .chip {
    width: 44px; height: 44px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--r-chip);
    border: 1px solid;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .chip svg { width: 21px; height: 21px; }
  .chip-download { color: #22d3ee; background: rgba(34,211,238,0.08); border-color: rgba(34,211,238,0.22); }
  .chip-relay    { color: #d4d4d8; background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.10); }

  .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .name { font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-1); }
  .desc { font-size: 12.5px; color: var(--text-2); line-height: 1.45;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .go {
    width: 32px; height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-3);
    border: 1px solid var(--border);
    border-radius: var(--r-go);
    transition-property: background-color, border-color, color, transform;
    transition-duration: 0.25s;
    transition-timing-function: var(--ease-out);
  }
  .go svg {
    width: 15px; height: 15px;
    translate: -1px 0;
    transition: transform 0.3s var(--ease-spring);
  }
  .cell:hover .go { background: #ffffff; border-color: #ffffff; color: #0b0b0f; }
  .cell:hover .go svg { transform: translateX(3px); }
  .cell:active .go { transform: scale(0.94); }

  /* Help line under the download card (save fallback / error) */
  #dlHelp { display: none; margin: 2px 4px 0; font-size: 12px; line-height: 1.6; color: var(--text-3); }
  #dlHelp a { color: var(--accent); text-decoration: underline; }
  #dlHelp .fallback-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  #dlHelp .fallback-links a {
    font-size: 11px; text-decoration: none;
    border: 1px solid var(--border-strong); border-radius: 999px; padding: 4px 10px;
    color: var(--text-1);
  }
  #dlHelp .fallback-links a:hover { border-color: #ffffff; }

  footer { margin-top: 44px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  footer .mark {
    font-family: var(--font-display);
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.4em; text-indent: 0.4em; text-transform: uppercase;
    color: var(--text-2);
  }
  footer .est {
    font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-3);
  }

  @media (prefers-reduced-motion: no-preference) {
    .rise {
      opacity: 0;
      animation: rise 0.7s var(--ease-out) forwards;
      animation-delay: var(--delay, 0s);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px) scale(0.985); filter: blur(6px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .cell, .go, .go svg, .dl-cta, .cell::before, .cell::after,
    .gate-action, .gate-action svg, .reveal-wrap, .relay-list { transition: none; }
    .spin { animation: none; }
    .rise { opacity: 1; animation: none; }
  }

  @media (max-width: 620px) {
    .grid { grid-template-columns: 1fr; }
    .span-2 { grid-column: span 1; }
  }
  @media (max-height: 640px) {
    body { padding-top: 24px; padding-bottom: 24px; }
    header { margin-bottom: 20px; }
    header img { width: min(260px, 80%); }
    .section-relays { margin-top: 28px; }
  }
</style>
</head>

<body>
  <script>
    /* WATCHDOG: independent of the main script. If the main script never
       boots (stale cached copy), explain instead of leaving dead controls. */
    window.__mantleBooted = false;
    setTimeout(function () {
      if (window.__mantleBooted) return;
      var b = document.createElement("div");
      b.style.cssText = "position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10001;background:#16161b;border:1px solid rgba(255,255,255,0.17);color:#f4f4f5;font:12.5px/1.5 Arial,sans-serif;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.5);text-align:center;max-width:88vw";
      b.innerHTML = "<b>Mantle loaded an out-of-date copy.</b><br>Hold Ctrl and press R to refresh.";
      (document.body || document.documentElement).appendChild(b);
    }, 2500);
  </script>

  <div class="bg" aria-hidden="true"></div>

  <main>
    <header class="rise" style="--delay:0s">
      <img src="https://mantleunblocked.github.io/assets/full%20logo.png" alt="Mantle" draggable="false">
      <p>One file, no install. It pulls the latest Mantle every time it opens.</p>
    </header>

    <!-- SECTION 1: the launcher file -->
    <section class="grid" aria-label="Get the launcher file">

      <button type="button" id="dlCard" class="cell featured span-2 dl rise" style="--delay:.06s" aria-busy="false">
        <span class="dl-top">
          <span class="chip chip-download" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          </span>
          <span class="meta">
            <span class="name">Mantle Launcher File</span>
            <span class="desc" id="dlDesc">Saves Mantle.html to your device.</span>
          </span>
        </span>
        <span class="dl-cta" id="dlCta" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span id="dlCtaLabel">Download</span>
        </span>
        <span class="dl-note">
          Open the file any time. No install, no admin rights. It pulls the newest
          Mantle on every launch, so the file never needs replacing.
        </span>
      </button>

      <div id="dlHelp" aria-live="polite"></div>

    </section>

    <!-- SECTION 2: relays behind an explicit disclosure -->
    <section class="section-relays" aria-label="Direct links">

      <button type="button" id="relayGate" class="cell gate rise" style="--delay:.14s"
              aria-expanded="false" aria-controls="relayWrap">
        <span class="gate-text">
          <span class="name">Files don't work in your school?</span>
          <span class="desc">Direct links that open Mantle in your browser. They may already be blocked, and are <b>easy for your school to block if caught</b>, so the launcher file above is always the safer option.</span>
        </span>
        <span class="gate-action">
          <span id="gateLabel">Show links</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </span>
      </button>

      <div class="reveal-wrap" id="relayWrap">
        <div class="reveal-inner">
          <div class="relay-list" id="relayList">
            <!-- relay cards are appended here by the script -->
          </div>
        </div>
      </div>

    </section>

    <footer class="rise" style="--delay:.24s">
      <span class="mark">© 2026 Mantle</span>
      <span class="est">Est 2025</span>
    </footer>
  </main>

<script>
"use strict";

/* ============================================================
   CONFIG
   ============================================================ */
// The launcher file (Mantle.html), via mirrors of the raw link.
// First responder wins. Case matters: the file is Mantle.html.
const SHELL_SOURCES = [
  "https://cdn.jsdelivr.net/gh/dobberr/mantle-menu@main/Mantle.html",
  "https://raw.githubusercontent.com/dobberr/mantle-menu/refs/heads/main/Mantle.html",
  "https://raw.githack.com/dobberr/mantle-menu/main/Mantle.html",
  "https://cdn.statically.io/gh/dobberr/mantle-menu/main/Mantle.html"
];
const SHELL_FILENAME = "Mantle.html";

/* RELAY LINKS: edit this list. Each entry becomes one card.
   These open Mantle directly in the browser tab. */
const RELAYS = [
  { name: "Relay 1", url: "https://mantle-menu.mantleunblocked.workers.dev/" },
  { name: "Relay 2", url: "https://sites.google.com/view/mantle-menu/" }
];

/* ============================================================
   SHELL DOWNLOAD — wiring first, decoration last
   ============================================================ */
const dlCard = document.getElementById("dlCard");
const dlCta = document.getElementById("dlCta");
const dlCtaLabel = document.getElementById("dlCtaLabel");
const dlDesc = document.getElementById("dlDesc");
const dlHelp = document.getElementById("dlHelp");
const DL_DESC_DEFAULT = dlDesc.textContent;
const CTA_DEFAULT =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg><span>Download</span>';

let dlState = "idle"; // idle | busy | ok | bad

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function setCta(html, cls) {
  dlCta.innerHTML = html;
  dlCta.className = "dl-cta" + (cls ? " " + cls : "");
}

function saveFile(text, blobUrlOut) {
  const blob = new Blob([text], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = SHELL_FILENAME;
  document.body.appendChild(a);
  a.click();
  a.remove();
  if (blobUrlOut) blobUrlOut.value = url; // keep alive for right-click save-as
}

dlCard.addEventListener("click", async function () {
  if (dlState === "busy") return;
  dlState = "busy";
  dlCard.setAttribute("aria-busy", "true");
  dlHelp.style.display = "none";
  dlDesc.textContent = DL_DESC_DEFAULT;
  setCta('<span class="spin"></span><span>Fetching</span>', "");

  let lastErr;
  for (const url of SHELL_SOURCES) {
    try {
      const res = await fetch(url, { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      // Fingerprint check: rejects school block pages served with 200
      if (text.length < 400 || !/<html/i.test(text) || !/mantle/i.test(text))
        throw new Error("Response wasn't the launcher file");

      const box = { value: null };
      saveFile(text, box);

      dlState = "ok";
      dlCard.setAttribute("aria-busy", "false");
      setCta('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg><span>Saved</span>', "ok");
      dlDesc.textContent = "Saved as " + SHELL_FILENAME + ". Open it to start Mantle.";
      dlHelp.innerHTML = 'Not in your Downloads folder? Your embed may block saves: ' +
        '<a href="' + box.value + '" download="' + SHELL_FILENAME + '">right-click this link and choose "Save link as"</a>.';
      dlHelp.style.display = "block";
      console.info("[Mantle] launcher file served from " + new URL(url).host);
      return;
    } catch (e) { lastErr = e; }
  }

  dlState = "bad";
  dlCard.setAttribute("aria-busy", "false");
  setCta('<span>Failed</span>', "bad");
  dlDesc.textContent = "Every mirror was blocked on this network.";
  dlHelp.innerHTML = 'Open one of these directly, then press Ctrl+S to save it as ' + SHELL_FILENAME + ':' +
    '<span class="fallback-links">' +
    SHELL_SOURCES.map(function (u) {
      return '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(new URL(u).host) + "</a>";
    }).join("") +
    "</span>";
  dlHelp.style.display = "block";
});

/* ============================================================
   RELAY DISCLOSURE — explicit labeled action, rotating chevron,
   interruptible height transition.
   ============================================================ */
(function setupRelays() {
  const section = document.querySelector(".section-relays");
  const gate = document.getElementById("relayGate");
  const label = document.getElementById("gateLabel");
  const wrap = document.getElementById("relayWrap");
  const list = document.getElementById("relayList");

  // No relays configured: the whole section has nothing to offer
  if (!RELAYS.length) { section.style.display = "none"; return; }

  const extSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>';
  const arrowSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>';

  RELAYS.forEach(function (r) {
    const a = document.createElement("a");
    a.className = "cell relay";
    a.href = r.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML =
      '<span class="chip chip-relay" aria-hidden="true">' + extSvg + "</span>" +
      '<span class="meta"><span class="name">' + esc(r.name) + "</span>" +
      '<span class="desc">' + esc(r.url) + "</span></span>" +
      '<span class="go" aria-hidden="true">' + arrowSvg + "</span>";
    list.appendChild(a);
  });

  let open = false;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  gate.addEventListener("click", function () {
    open = !open;
    gate.setAttribute("aria-expanded", String(open));
    label.textContent = open ? "Hide links" : "Show links";
    wrap.classList.toggle("open", open);

    // After opening, make sure the revealed links are in view
    if (open) {
      setTimeout(function () {
        try {
          wrap.scrollIntoView({
            behavior: reduceMotion.matches ? "auto" : "smooth",
            block: "nearest"
          });
        } catch (_) {}
      }, 150);
    }
  });
})();

/* Launch capability is live: disarm the watchdog */
window.__mantleBooted = true;
console.info("[Mantle] download hub ready · v1.6");

/* ============================================================
   DECORATIVE LAYER — spotlight + entrance cleanup, last
   ============================================================ */
document.querySelectorAll(".cell").forEach(function (card) {
  card.addEventListener("pointermove", function (e) {
    const r = card.getBoundingClientRect();
    card.style.setProperty("--mx", (e.clientX - r.left) + "px");
    card.style.setProperty("--my", (e.clientY - r.top) + "px");
  });
});

document.querySelectorAll(".rise").forEach(function (el) {
  el.addEventListener("animationend", function (e) {
    if (e.target === el) el.classList.remove("rise");
  }, { once: true });
});
</script>
</body>
